<div class="checkout-page">
  <h1 class="h4 fw-semibold mb-4">Checkout</h1>

  <section class="checkout-section">
    <h2 class="section-title">Shipping Details</h2>
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control app-input" />
      </div>
      <div class="col-12">
        <label class="form-label">Address</label>
        <input type="text" class="form-control app-input" />
      </div>
      <div class="col-6">
        <label class="form-label">City</label>
        <input type="text" class="form-control app-input" />
      </div>
      <div class="col-6">
        <label class="form-label">Postal Code</label>
        <input type="text" class="form-control app-input" />
      </div>
    </div>
  </section>

  <section class="checkout-section">
    <h2 class="section-title">Payment</h2>
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">Card Number</label>
        <input type="text" class="form-control app-input" placeholder="1234 5678 9012 3456" />
      </div>
      <div class="col-6">
        <label class="form-label">Expiry</label>
        <input type="text" class="form-control app-input" placeholder="MM/YY" />
      </div>
      <div class="col-6">
        <label class="form-label">CVV</label>
        <input type="text" class="form-control app-input" placeholder="123" />
      </div>
    </div>
  </section>

  <section class="checkout-section order-summary">
    <h2 class="section-title">Order Summary</h2>
    <div class="d-flex justify-content-between mb-2">
      <span class="text-muted">Subtotal</span>
      <span>$203.00</span>
    </div>
    <div class="d-flex justify-content-between mb-2">
      <span class="text-muted">Shipping</span>
      <span>$5.00</span>
    </div>
    <div class="d-flex justify-content-between mb-3">
      <span class="text-muted">Tax</span>
      <span>$16.24</span>
    </div>
    <div class="d-flex justify-content-between total-row pt-3">
      <span class="fw-semibold">Total</span>
      <span class="fw-semibold">$224.24</span>
    </div>
  </section>

  <button type="button" class="btn btn-accent w-100 place-order-btn">Place Order</button>
</div>
